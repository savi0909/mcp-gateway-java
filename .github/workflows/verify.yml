name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Python 3.13 for the engineering harness
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify engineering harness with isolated fake processes
        run: python -B -m unittest discover -s harness/tests -v
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: sh ./mvnw -B -ntp verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp verify
