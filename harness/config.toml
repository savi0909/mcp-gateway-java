schema_version = 1
batch_enabled = false
publish = true

[limits]
run_seconds = 3600
agent_seconds = 1200
verify_seconds = 900
review_seconds = 600
max_repairs = 3

[models.implement]
name = "gpt-6.1-sol"
reasoning_effort = "medium"

[models.complex_implement]
name = "gpt-6-astra"
reasoning_effort = "high"

[models.review]
name = "gpt-6-astra"
reasoning_effort = "high"

[baseline.surefire]
"dev.mcp.gateway.admission.AdmissionBoundaryTest" = 3
"dev.mcp.gateway.admission.VerifiedPolicyCacheTest" = 4
"dev.mcp.gateway.catalog.FileCatalogLoaderTest" = 3
"dev.mcp.gateway.config.GatewayPropertiesTest" = 38
"dev.mcp.gateway.rest.CommittedCancellationTest" = 1
"dev.mcp.gateway.rest.RestBindingExecutorTest" = 50
"dev.mcp.gateway.rest.RestBindingTest" = 26
"dev.mcp.gateway.ScaffoldStartupTest" = 1
"dev.mcp.gateway.security.SecurityPolicyTest" = 2

[baseline.failsafe]
"dev.mcp.gateway.admission.Uc01AdmissionIT" = 14
"dev.mcp.gateway.mcp.CatalogProtocolIT" = 4
"dev.mcp.gateway.mcp.CoordinatorToolsIT" = 6
"dev.mcp.gateway.mcp.ResponseLossIT" = 3
"dev.mcp.gateway.mcp.SecuredGatewayIT" = 7
